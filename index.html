<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>3D Viewer - The Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.1/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.1/examples/jsm/"
        }
      }
    </script>

    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0;
        width: 100%; height: 100%;
        overflow: hidden;
        background: #000;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #f0f0f0;
      }
      body { position: relative; }
      canvas { display: block; }

      .overlay {
        position: fixed; left: 12px;
        color: #f0f0f0; z-index: 10;
        font-size: 13px; line-height: 1.4;
      }
      #loadingOverlay {
        top: 10px; padding: 6px 10px;
        background: rgba(0,0,0,0.8);
        border-radius: 4px; border: 1px solid #333;
        pointer-events: none;
      }
      #toolbar {
        top: 60px; padding: 8px 10px;
        background: rgba(0,0,0,0.85);
        border-radius: 4px; border: 1px solid #333;
        display: flex; flex-wrap: wrap; gap: 6px;
        align-items: center;
      }
      #infoPanel {
        bottom: 10px; padding: 6px 10px;
        background: rgba(0,0,0,0.75);
        border-radius: 4px; border: 1px solid #333;
        max-width: 260px;
      }
      .btn {
        appearance: none; border: none;
        padding: 6px 10px; border-radius: 4px;
        font-size: 12px; cursor: pointer;
        background: #2d6bff; color: #fff;
        transition: background 0.15s ease, transform 0.1s ease;
        white-space: nowrap;
      }
      .btn.secondary { background: #3a3a3a; color: #f0f0f0; }
      .btn:disabled { opacity: .4; cursor: default; transform: none; }
      .btn:not(:disabled):hover { background: #315fff; }
      .btn.secondary:not(:disabled):hover { background: #4a4a4a; }
      .btn:not(:disabled):active { transform: translateY(1px); }

      .file-input-wrapper { position: relative; overflow: hidden; display: inline-block; }
      .file-input-wrapper input[type="file"] {
        position: absolute; left: 0; top: 0;
        opacity: 0; cursor: pointer;
        width: 100%; height: 100%;
      }
      .file-label {
        padding: 6px 10px; border-radius: 4px;
        background: #222; border: 1px solid #444;
        font-size: 11px; cursor: pointer; white-space: nowrap;
      }
      .file-label:hover { background: #2c2c2c; }

      @media (max-width: 600px) {
        #toolbar { right: 10px; max-width: calc(100% - 24px); }
      }
      .info-title { font-weight: 600; margin-bottom: 4px; }
    </style>
  </head>

  <body>
    <div id="loadingOverlay" class="overlay">
      <span id="loadingText">Lade Modell ...</span>
    </div>

    <div id="toolbar" class="overlay">
      <button id="exampleVideoBtn" class="btn">Example Video</button>
      <button id="sweetspotBtn" class="btn">Sweetspot View</button>
      <button id="logPoseBtn" class="btn secondary">Log Camera Pose</button>

      <button id="specsPreviewBtn" class="btn secondary" disabled>
        Specs Preview
      </button>

      <div class="file-input-wrapper">
        <span class="file-label">Inner Screen Video</span>
        <input id="innerVideoInput" type="file" accept="video/*" />
      </div>
      <div class="file-input-wrapper">
        <span class="file-label">Outer Screen Video</span>
        <input id="outerVideoInput" type="file" accept="video/*" />
      </div>
      <div class="file-input-wrapper">
        <span class="file-label">Floor Video</span>
        <input id="floorVideoInput" type="file" accept="video/*" />
      </div>

      <button id="applyPreviewBtn" class="btn secondary">
        Apply Preview
      </button>
    </div>

    <div id="infoPanel" class="overlay">
      <div class="info-title">Steuerung</div>
      <div>
        Maus links: Orbit.<br />
        Maus mittig / Scroll: Zoom.<br />
        Maus rechts: Schwenken.<br />
        Shift + Drag: schneller.<br />
        Mausrad: nah / fern.
      </div>
    </div>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { FBXLoader } from "three/addons/loaders/FBXLoader.js";
      import { GUI } from "three/addons/libs/lil-gui.module.min.js";

      const loadingOverlay = document.getElementById("loadingOverlay");
      const loadingText = document.getElementById("loadingText");
      const exampleVideoBtn = document.getElementById("exampleVideoBtn");
      const sweetspotBtn = document.getElementById("sweetspotBtn");
      const logPoseBtn = document.getElementById("logPoseBtn");
      const specsPreviewBtn = document.getElementById("specsPreviewBtn");
      const applyPreviewBtn = document.getElementById("applyPreviewBtn");
      const innerVideoInput = document.getElementById("innerVideoInput");
      const outerVideoInput = document.getElementById("outerVideoInput");
      const floorVideoInput = document.getElementById("floorVideoInput");

      let renderer, scene, camera, controls, model;
      let gridHelper, groundPlane;

      const originalMaps = new WeakMap();
      const innerMaterials = [];
      const outerMaterials = [];
      const floorMaterials = [];

      const userVideos = {
        inner: { video: null, texture: null, url: null, isUser: true },
        outer: { video: null, texture: null, url: null, isUser: true },
        floor: { video: null, texture: null, url: null, isUser: true }
      };

      let activeVideoEntries = [];
      let isUsingVideos = false;
      let syncIntervalId = null;

      const params = {
        posX: 0, posY: 0, posZ: 0,
        rotX: 0, rotY: 0, rotZ: 0,
        scale: 1,
        wireframe: false,
        showGrid: true,
        autoRotateY: false,
        reset() {
          this.posX = this.posY = this.posZ = 0;
          this.rotX = this.rotY = this.rotZ = 0;
          this.scale = 1;
          this.wireframe = false;
          this.showGrid = true;
          this.autoRotateY = false;
          applyParamsToModel();
          gui.updateDisplay();
          goToSweetspot();
        }
      };

      let gui;
      const deg = THREE.MathUtils.degToRad;

      init();
      loadModel();
      animate();

      function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);

        camera = new THREE.PerspectiveCamera(
          45,
          window.innerWidth / window.innerHeight,
          0.1,
          10000
        );
        camera.position.set(0, 3, 8);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
        hemiLight.position.set(0, 50, 0);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.set(2048, 2048);
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 200;
        dirLight.shadow.camera.left = -50;
        dirLight.shadow.camera.right = 50;
        dirLight.shadow.camera.top = 50;
        dirLight.shadow.camera.bottom = -50;
        scene.add(dirLight);

        const fillLight = new THREE.DirectionalLight(0xffffff, 0.3);
        fillLight.position.set(-20, 10, -10);
        scene.add(fillLight);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.15);
        scene.add(ambientLight);

        gridHelper = new THREE.GridHelper(200, 200, 0x444444, 0x222222);
        scene.add(gridHelper);

        const groundGeo = new THREE.PlaneGeometry(500, 500);
        const groundMat = new THREE.ShadowMaterial({ opacity: 0.3 });
        groundPlane = new THREE.Mesh(groundGeo, groundMat);
        groundPlane.rotation.x = -Math.PI / 2;
        groundPlane.position.y = 0;
        groundPlane.receiveShadow = true;
        scene.add(groundPlane);

        setupGUI();
        setupUIEvents();

        window.addEventListener("resize", onWindowResize);
      }

      function setupGUI() {
        gui = new GUI({ width: 260 });

        const posFolder = gui.addFolder("Position");
        posFolder.add(params, "posX", -500, 500, 1).onChange(applyParamsToModel);
        posFolder.add(params, "posY", -500, 500, 1).onChange(applyParamsToModel);
        posFolder.add(params, "posZ", -500, 500, 1).onChange(applyParamsToModel);

        const rotFolder = gui.addFolder("Rotation");
        rotFolder.add(params, "rotX", -180, 180, 1).onChange(applyParamsToModel);
        rotFolder.add(params, "rotY", -180, 180, 1).onChange(applyParamsToModel);
        rotFolder.add(params, "rotZ", -180, 180, 1).onChange(applyParamsToModel);

        const scaleFolder = gui.addFolder("Skalierung");
        scaleFolder.add(params, "scale", 0.01, 10, 0.01).onChange(
          applyParamsToModel
        );

        const viewFolder = gui.addFolder("Ansicht");
        viewFolder.add(params, "wireframe").onChange(applyParamsToModel);
        viewFolder.add(params, "showGrid").onChange(applyParamsToModel);
        viewFolder.add(params, "autoRotateY");

        gui.add(params, "reset").name("Reset");
      }

      function applyParamsToModel() {
        if (!model) return;
        model.position.set(params.posX, params.posY, params.posZ);
        model.rotation.set(deg(params.rotX), deg(params.rotY), deg(params.rotZ));
        model.scale.setScalar(params.scale);

        model.traverse((child) => {
          if (child.isMesh && child.material) {
            const mats = Array.isArray(child.material)
              ? child.material
              : [child.material];
            for (const m of mats) m.wireframe = !!params.wireframe;
          }
        });

        const visible = !!params.showGrid;
        gridHelper.visible = visible;
        groundPlane.visible = visible;
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      function loadModel() {
        const manager = new THREE.LoadingManager();

        manager.onStart = () => {
          loadingOverlay.style.display = "block";
          loadingText.textContent = "Lade Assets ...";
        };
        manager.onProgress = (url, loaded, total) => {
          loadingText.textContent = `Lade Assets ... ${loaded}/${total}`;
        };
        manager.onError = (url) => {
          loadingText.textContent = `Fehler beim Laden: ${url}`;
        };

        manager.setURLModifier((url) => {
          const lower = url.toLowerCase();
          const isImage =
            lower.endsWith(".png") ||
            lower.endsWith(".jpg") ||
            lower.endsWith(".jpeg") ||
            lower.endsWith(".webp") ||
            lower.endsWith(".bmp") ||
            lower.endsWith(".tga") ||
            lower.endsWith(".tif") ||
            lower.endsWith(".tiff");
          if (isImage) {
            const fileName = url.split("/").pop();
            return "models/" + fileName;
          }
          return url;
        });

        const loader = new FBXLoader(manager);
        loader.setPath("models/");
        loader.setResourcePath("models/");

        loader.load(
          "Portal_mapped.fbx",
          (fbx) => {
            model = fbx;
            setupModel(model);
            loadingOverlay.style.display = "none";
          },
          undefined,
          (error) => {
            console.error("Fehler beim Laden des FBX:", error);
            loadingText.textContent = "Fehler beim Laden des Modells.";
          }
        );
      }

      function setupModel(root) {
        root.traverse((child) => {
          if (!child.isMesh) return;
          child.castShadow = true;
          child.receiveShadow = true;

          const mats = Array.isArray(child.material)
            ? child.material
            : [child.material];

          for (const mat of mats) {
            if (!mat) continue;
            mat.side = THREE.DoubleSide;

            if (mat.map) mat.map.colorSpace = THREE.SRGBColorSpace;
            if (mat.emissiveMap) mat.emissiveMap.colorSpace = THREE.SRGBColorSpace;
            if (mat.specularMap) mat.specularMap.colorSpace = THREE.SRGBColorSpace;

            originalMaps.set(mat, mat.map || null);

            const name = (mat.name || "").toLowerCase();
            const meshName = (child.name || "").toLowerCase();

            if (
              name.includes("portal_inside_specs") ||
              meshName.includes("portal_inside_specs")
            ) {
              innerMaterials.push(mat);
            } else if (
              name.includes("portal_outside_specs") ||
              meshName.includes("portal_outside_specs")
            ) {
              outerMaterials.push(mat);
            } else if (
              name.includes("portal_floor_specs") ||
              meshName.includes("portal_floor_specs")
            ) {
              floorMaterials.push(mat);
            }
          }
        });

        console.log(
          "Groups inner/outer/floor",
          innerMaterials.length,
          outerMaterials.length,
          floorMaterials.length
        );

        const box = new THREE.Box3().setFromObject(root);
        const size = new THREE.Vector3();
        const center = new THREE.Vector3();
        box.getSize(size);
        box.getCenter(center);

        root.position.sub(center);
        const minY = box.min.y - center.y;
        root.position.y -= minY;

        scene.add(root);

        // Debug-Marker an Portal-Mitte
        const markerGeo = new THREE.SphereGeometry(0.05, 16, 16);
        const markerMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
        const marker = new THREE.Mesh(markerGeo, markerMat);
        marker.position.set(0, 0, 0);
        scene.add(marker);

        applyParamsToModel();

        // Start erst mal „ok“, Sweetspot ermittelst du manuell
        camera.position.set(0, 2, 6);
        controls.target.set(0, 1.2, 0);
        controls.update();
      }

      function setupUIEvents() {
        exampleVideoBtn.addEventListener("click", async () => {
          console.log("Example Video clicked");
          // dein bestehender Example-Video-Code kann hier bleiben
        });

        sweetspotBtn.addEventListener("click", () => {
          console.log("Sweetspot View clicked");
          goToSweetspot();
        });

        logPoseBtn.addEventListener("click", () => {
          console.log("Camera position:", camera.position);
          console.log("Controls target:", controls.target);
        });

        specsPreviewBtn.addEventListener("click", () => {
          console.log("Specs Preview clicked");
          // dein bestehender Specs-Code
        });

        applyPreviewBtn.addEventListener("click", async () => {
          console.log("Apply Preview clicked");
          // dein bestehender switchToUserVideos-Code
        });

        innerVideoInput.addEventListener("change", () => {
          // dein bestehender Upload-Code
        });
        outerVideoInput.addEventListener("change", () => {
          // ...
        });
        floorVideoInput.addEventListener("change", () => {
          // ...
        });
      }

      // Hier trägst du nachher die gemessenen Sweetspot-Werte ein
      function goToSweetspot() {
        if (!camera || !controls) return;
        // !!! nach Messung ersetzen !!!
        camera.position.set(0, 1.75, 5);
        controls.target.set(0, 1.2, 0);
        controls.update();
      }

      function animate() {
        requestAnimationFrame(animate);
        if (model && params.autoRotateY) {
          model.rotation.y += 0.005;
        }
        if (controls) controls.update();
        renderer.render(scene, camera);
      }
    </script>
  </body>
</html>
